<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>淨連結</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="淨連結">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0d10;
    --panel: #12171b;
    --panel-2: #171d22;
    --line: #232b31;
    --text: #e7edf0;
    --muted: #7c8992;
    --accent: #4fd8c4;
    --accent-dim: #2a5952;
    --danger: #ff6b6b;
    --danger-dim: #4a2626;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; min-height:100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body{
    display:flex; flex-direction:column; align-items:center;
    padding: 32px 18px 60px;
  }
  .bg-grid{
    position:fixed; inset:0; z-index:-1;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 40%, transparent 100%);
  }
  header{
    width:100%; max-width:560px;
    margin-bottom: 28px;
  }
  .eyebrow{
    display:flex; align-items:center; gap:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px; letter-spacing: 0.12em;
    color: var(--accent); text-transform: uppercase;
    margin-bottom: 14px;
  }
  .eyebrow .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  h1{
    font-size: 30px; font-weight:700; line-height:1.15;
    margin:0 0 8px; letter-spacing:-0.01em;
  }
  h1 span{ color: var(--accent); }
  .sub{
    color: var(--muted); font-size:14.5px; line-height:1.55;
    max-width: 46ch;
  }

  .card{
    width:100%; max-width:560px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    margin-bottom:16px;
  }
  label{
    display:block; font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    color: var(--muted); margin-bottom:10px;
  }
  textarea{
    width:100%; min-height:96px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size: 14px; line-height:1.5;
    padding: 12px 14px;
    resize: vertical;
    outline: none;
    transition: border-color .15s ease;
  }
  textarea::placeholder{ color:#4a555c; }
  textarea:focus{ border-color: var(--accent); }

  .actions{
    display:flex; gap:10px; margin-top:14px;
  }
  button{
    font-family:'Space Grotesk', sans-serif;
    font-size:14.5px; font-weight:600;
    border-radius: 10px; border: none;
    padding: 12px 18px;
    cursor:pointer;
    transition: transform .1s ease, opacity .15s ease;
  }
  button:active{ transform: scale(0.97); }
  .btn-primary{
    background: var(--accent); color:#052420;
    flex:1;
  }
  .btn-primary:disabled{ opacity:.35; cursor:not-allowed; }
  .btn-ghost{
    background: transparent; color: var(--muted);
    border: 1px solid var(--line);
  }

  .result{
    display:none;
  }
  .result.show{ display:block; }

  .diff-block{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px; line-height:1.7;
    word-break: break-all;
    padding: 14px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 14px;
  }
  .diff-block .kept{ color: var(--text); }
  .diff-block .stripped{
    color: var(--danger);
    text-decoration: line-through;
    text-decoration-color: rgba(255,107,107,0.55);
    opacity: 0.75;
  }

  .clean-url-row{
    display:flex; align-items:center; gap:10px;
    background: var(--panel-2);
    border: 1px solid var(--accent-dim);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .clean-url{
    flex:1; font-family:'IBM Plex Mono', monospace;
    font-size:13.5px; color: var(--accent);
    word-break: break-all;
  }
  .copy-btn{
    flex-shrink:0;
    background: var(--accent-dim); color: var(--accent);
    padding: 8px 14px; font-size:13px;
    border-radius:8px;
  }
  .copy-btn.copied{ background: var(--accent); color:#052420; }

  .stats-row{
    display:flex; gap: 16px;
    margin-top: 14px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px; color: var(--muted);
  }
  .stats-row b{ color: var(--text); font-weight:600; }

  .empty-hint{
    color: var(--muted); font-size: 13px;
    text-align:center; padding: 8px 4px 2px;
  }

  .share-badge{
    display:none;
    align-items:center; gap:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; color:#052420;
    background: var(--accent);
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 14px;
    width: 100%; max-width:560px;
  }
  .share-badge.show{ display:flex; }

  footer{
    max-width:560px; width:100%;
    margin-top: 8px;
    font-size: 12px; color: #4a555c;
    text-align:center; line-height:1.6;
  }
</style>
</head>
<body>
<div class="bg-grid"></div>

<header>
  <div class="eyebrow"><span class="dot"></span>本機處理 · 不經任何伺服器</div>
  <h1>把追蹤碼<span>洗</span>掉。</h1>
  <div class="sub">貼上分享出來的連結，工具會在你的裝置上直接拆解、移除 igsh、utm_*、fbclid 這類追蹤參數，乾淨的連結留在原地。</div>
</header>

<div class="share-badge" id="shareBadge">✓ 已從分享清單接收連結，內容已自動帶入並清除</div>

<div class="card">
  <label for="input">貼上連結</label>
  <textarea id="input" placeholder="https://www.threads.com/share/xxxxxx/?igsh=AbCdEfGh..."></textarea>
  <div class="actions">
    <button class="btn-primary" id="cleanBtn" disabled>清除追蹤碼</button>
    <button class="btn-ghost" id="pasteBtn">貼上剪貼簿</button>
  </div>
</div>

<div class="card result" id="resultCard">
  <label>比對結果</label>
  <div class="diff-block" id="diffBlock"></div>

  <label>乾淨連結</label>
  <div class="clean-url-row">
    <div class="clean-url" id="cleanUrl"></div>
    <button class="copy-btn" id="copyBtn">複製</button>
  </div>

  <div class="stats-row" id="statsRow"></div>
</div>

<footer>
  追蹤碼比對與清除都在瀏覽器本機執行。若貼上的是短網址，會先送到自己架設的 Function 展開成完整網址，過程不記錄、不經第三方。<br>
  可將此頁加入主畫面，加入後也會出現在系統的「分享」清單中。
</footer>

<script>
  // 部署 functions/ 資料夾後，把下面換成你實際的 Function 網址
  // (Firebase 部署完成後主控台/CLI 輸出會給你這個網址，格式通常是
  //  https://<region>-<project-id>.cloudfunctions.net/expandUrl
  //  或 2nd gen 的 https://expandurl-xxxxx-<region>.a.run.app)
  const EXPAND_ENDPOINT = "https://REGION-PROJECT_ID.cloudfunctions.net/expandUrl";

  const TRACKING_PARAMS = [
    'igsh','igshid','utm_source','utm_medium','utm_campaign','utm_term','utm_content',
    'fbclid','gclid','si','ref','ref_src','xmt','slof','spm','from','share_id','s',
    '_openstat','yclid','mc_cid','mc_eid'
  ];

  const input = document.getElementById('input');
  const cleanBtn = document.getElementById('cleanBtn');
  const pasteBtn = document.getElementById('pasteBtn');
  const resultCard = document.getElementById('resultCard');
  const diffBlock = document.getElementById('diffBlock');
  const cleanUrlEl = document.getElementById('cleanUrl');
  const copyBtn = document.getElementById('copyBtn');
  const statsRow = document.getElementById('statsRow');
  const shareBadge = document.getElementById('shareBadge');

  input.addEventListener('input', () => {
    cleanBtn.disabled = input.value.trim().length === 0;
  });

  pasteBtn.addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      input.value = text;
      cleanBtn.disabled = text.trim().length === 0;
      input.focus();
    } catch (e) {
      input.focus();
    }
  });

  function cleanUrl(rawUrl) {
    let url;
    try {
      url = new URL(rawUrl.trim());
    } catch (e) {
      return null;
    }
    const kept = [];
    const stripped = [];
    for (const [key, value] of url.searchParams.entries()) {
      if (TRACKING_PARAMS.includes(key.toLowerCase())) {
        stripped.push([key, value]);
      } else {
        kept.push([key, value]);
      }
    }
    const cleanParams = new URLSearchParams();
    kept.forEach(([k, v]) => cleanParams.append(k, v));
    const qs = cleanParams.toString();
    const cleaned = url.origin + url.pathname + (qs ? '?' + qs : '') + url.hash;
    return { cleaned, kept, stripped, base: url.origin + url.pathname };
  }

  function renderDiff(result) {
    const { base, kept, stripped } = result;
    let html = `<span class="kept">${escapeHtml(base)}</span>`;
    const allParams = [...kept.map(p => [...p, false]), ...stripped.map(p => [...p, true])];
    allParams.forEach(([k, v, isStripped], i) => {
      const prefix = i === 0 ? '?' : '&';
      const pair = `${prefix}${k}=${v}`;
      html += isStripped
        ? `<span class="stripped">${escapeHtml(pair)}</span>`
        : `<span class="kept">${escapeHtml(pair)}</span>`;
    });
    diffBlock.innerHTML = html;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // 呼叫 Cloud Function 展開短網址；4 秒逾時或任何失敗都直接回傳原網址，
  // 絕不讓短網址展開失敗擋住原本「本機清除」的既有功能。
  async function tryExpand(rawUrl) {
    if (!EXPAND_ENDPOINT || EXPAND_ENDPOINT.includes('REGION-PROJECT_ID')) {
      // 還沒填實際的 Function 網址，直接跳過展開，走原本的本機清除
      return rawUrl;
    }
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 4000);
    try {
      const resp = await fetch(`${EXPAND_ENDPOINT}?url=${encodeURIComponent(rawUrl)}`, {
        signal: controller.signal
      });
      if (!resp.ok) return rawUrl;
      const data = await resp.json();
      return data.finalUrl || rawUrl;
    } catch (e) {
      return rawUrl;
    } finally {
      clearTimeout(timeout);
    }
  }

  async function runClean() {
    const raw = input.value.trim();

    cleanBtn.disabled = true;
    const originalLabel = cleanBtn.textContent;
    cleanBtn.textContent = '展開連結中…';

    const expanded = await tryExpand(raw);

    cleanBtn.textContent = originalLabel;
    cleanBtn.disabled = input.value.trim().length === 0;

    const result = cleanUrl(expanded);
    if (!result) {
      diffBlock.innerHTML = `<span class="stripped">這不是一個有效的網址，請確認貼上的內容。</span>`;
      cleanUrlEl.textContent = '';
      statsRow.innerHTML = '';
      resultCard.classList.add('show');
      return;
    }
    renderDiff(result);
    cleanUrlEl.textContent = result.cleaned;
    copyBtn.textContent = '複製';
    copyBtn.classList.remove('copied');
    const expandedNote = expanded !== raw ? ' · 已先展開短網址' : '';
    statsRow.innerHTML = result.stripped.length > 0
      ? `已移除 <b>${result.stripped.length}</b> 個追蹤參數 · 保留 <b>${result.kept.length}</b> 個必要參數${expandedNote}`
      : `沒有偵測到追蹤參數，連結本身已經乾淨。${expandedNote}`;
    resultCard.classList.add('show');
  }

  cleanBtn.addEventListener('click', runClean);

  copyBtn.addEventListener('click', async () => {
    const text = cleanUrlEl.textContent;
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      copyBtn.textContent = '已複製';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = '複製';
        copyBtn.classList.remove('copied');
      }, 1600);
    } catch (e) {
      const range = document.createRange();
      range.selectNode(cleanUrlEl);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
      cleanBtn.click();
    }
  });

  // --- Web Share Target handling ---
  // Android delivers shared content as query params on this page
  // (manifest.json share_target uses method: GET), e.g.
  // index.html?title=...&text=...&url=...
  function extractFirstUrl(str) {
    if (!str) return null;
    const match = str.match(/https?:\/\/[^\s]+/i);
    return match ? match[0] : null;
  }

  (function handleShareTarget() {
    const params = new URLSearchParams(window.location.search);
    if (![...params.keys()].length) return;

    const sharedUrl = params.get('url');
    const sharedText = params.get('text');
    const sharedTitle = params.get('title');

    const candidate = extractFirstUrl(sharedUrl) || extractFirstUrl(sharedText) || extractFirstUrl(sharedTitle);
    if (!candidate) return;

    input.value = candidate;
    cleanBtn.disabled = false;
    shareBadge.classList.add('show');
    runClean();

    // clean up the address bar so a refresh doesn't re-trigger this
    if (window.history && window.history.replaceState) {
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  })();
</script>
</body>
</html>
